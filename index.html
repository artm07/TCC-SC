<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="RGA">
  <title>RGA — Registro Geral Animal</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Tela de abertura -->
  <div id="splash" aria-hidden="true">
    <img src="img/logo-rga.png" alt="">
    <span>Registro Geral Animal</span>
  </div>

  <!-- ================= LOGIN / CRIAR CONTA ================= -->
  <section id="tela-login" class="tela-auth" hidden>
    <div class="auth-card">
      <div class="auth-marca">
        <img src="img/logo-rga.png" alt="RGA">
        <p>Registro Geral Animal</p>
        <small>Projeto acadêmico (TCC) — sistema fictício</small>
      </div>

      <div class="auth-forms">
        <!-- Entrar -->
        <form id="form-login" class="auth-form" novalidate>
          <h2>Entrar</h2>
          <label class="campo"><span>Login</span>
            <input name="login" autocomplete="username" placeholder="CPF ou e-mail">
          </label>
          <label class="campo"><span>Senha</span>
            <input name="senha" type="password" autocomplete="current-password" placeholder="Sua senha">
          </label>
          <button type="button" class="link link-direita" data-auth="esqueci">Esqueci minha senha</button>
          <p class="erro" role="alert"></p>
          <button class="btn btn-rosa btn-bloco">Entrar</button>
          <p class="auth-troca">Não tem conta? <button type="button" class="link" data-auth="conta">Cadastre-se</button></p>
        </form>

        <!-- Criar conta -->
        <form id="form-conta" class="auth-form" novalidate hidden>
          <h2>Criar conta</h2>
          <label class="campo"><span>Nome completo</span><input name="nome" autocomplete="name" maxlength="60"></label>
          <div class="grade-2">
            <label class="campo"><span>CPF</span><input name="cpf" inputmode="numeric" placeholder="000.000.000-00" maxlength="14"></label>
            <label class="campo"><span>Telefone</span><input name="telefone" inputmode="tel" placeholder="(00) 00000-0000" maxlength="15"></label>
          </div>
          <label class="campo"><span>E-mail</span><input name="email" type="email" autocomplete="email" maxlength="60"></label>
          <label class="campo"><span>Cidade / UF</span><input name="cidade" placeholder="Florianópolis / SC" maxlength="40"></label>
          <div class="grade-2">
            <label class="campo"><span>Senha</span><input name="senha" type="password" autocomplete="new-password" placeholder="Mín. 6 caracteres"></label>
            <label class="campo"><span>Confirmar senha</span><input name="senha2" type="password" autocomplete="new-password"></label>
          </div>
          <p class="erro" role="alert"></p>
          <button class="btn btn-rosa btn-bloco">Criar conta</button>
          <p class="auth-troca">Já tem conta? <button type="button" class="link" data-auth="login">Entrar</button></p>
        </form>

        <!-- Esqueci a senha -->
        <form id="form-esqueci" class="auth-form" novalidate hidden>
          <h2>Redefinir senha</h2>
          <p class="texto-suave">Confirme seus dados para criar uma senha nova.</p>
          <label class="campo"><span>CPF ou e-mail</span><input name="login"></label>
          <label class="campo"><span>Telefone cadastrado</span><input name="telefone" inputmode="tel" placeholder="(00) 00000-0000" maxlength="15"></label>
          <label class="campo"><span>Nova senha</span><input name="senha" type="password" autocomplete="new-password" placeholder="Mín. 6 caracteres"></label>
          <p class="erro" role="alert"></p>
          <button class="btn btn-rosa btn-bloco">Salvar nova senha</button>
          <p class="auth-troca"><button type="button" class="link" data-auth="login">Voltar para o login</button></p>
        </form>
      </div>
    </div>
  </section>

  <!-- ================= APLICATIVO (após login) ================= -->
  <div id="app" hidden>
    <header class="topo">
      <button class="btn-icone" id="abrir-menu" aria-label="Abrir menu"></button>
      <a href="#inicio" class="logo-topo"><img src="img/logo-rga.png" alt="RGA — início"></a>
      <span class="topo-ola" id="topo-ola"></span>
    </header>

    <div id="fundo-menu" hidden></div>
    <nav id="menu-lateral" aria-label="Menu principal">
      <div class="menu-usuario">
        <strong id="menu-nome"></strong>
        <small id="menu-email"></small>
      </div>
      <div id="menu-links"></div>
      <button class="menu-link menu-sair" id="btn-sair"></button>
    </nav>

    <main id="conteudo"></main>

    <!-- Assistente "Posso ajudar?" -->
    <button class="ajuda-flutuante nao-imprimir" id="btn-ajuda">
      <span class="gato"></span><span>Posso ajudar?</span>
    </button>
    <div class="chat nao-imprimir" id="chat" hidden>
      <div class="chat-topo">
        <span class="gato"></span>
        <div><strong>Assistente RGA</strong><small>Respostas rápidas</small></div>
        <button class="fechar-chat" id="fechar-chat" aria-label="Fechar">×</button>
      </div>
      <div class="chat-msgs" id="chat-msgs"></div>
      <form class="chat-envio" id="chat-form">
        <input id="chat-input" placeholder="Digite sua dúvida…" autocomplete="off">
        <button class="btn-icone" aria-label="Enviar" id="chat-enviar"></button>
      </form>
    </div>
  </div>

  <!-- Janela para detalhes -->
  <dialog id="modal">
    <div class="modal-conteudo">
      <button class="fechar" id="fechar-modal" aria-label="Fechar">×</button>
      <div id="modal-corpo"></div>
    </div>
  </dialog>

  <script src="js/dados.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
